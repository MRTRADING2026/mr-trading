<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MR Trading</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:16px;
}

.bar,main{
  max-width:1100px;
  margin:auto;
}

.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:800;
}

button{
  padding:10px 14px;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.admin{
  background:#fff;
}

.hero{
  background:#222;
  color:#fff;
  padding:45px 18px;
}

.hero>div{
  max-width:1100px;
  margin:auto;
}

.wrap{
  padding:25px 18px;
}

#panel,
#loginBox{
  display:none;
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:25px;
}

.form{
  max-width:600px;
  display:grid;
  gap:10px;
}

.form input,
#loginBox input{
  padding:12px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
  box-sizing:border-box;
  width:100%;
}

#loginBox input{
  max-width:600px;
  margin-bottom:10px;
}

.save,
.login{
  background:#111;
  color:#fff;
}

.logout{
  background:#d33;
  color:#fff;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #ddd;
}

.pic{
  height:180px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  padding:14px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.order{
  background:#111;
  color:#fff;
  width:100%;
}

.row{
  background:#eee;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.del{
  background:#d33;
  color:#fff;
}

.edit{
  background:#ddd;
}

#msg,
#loginMsg{
  font-weight:bold;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:450px){
  .grid{
    gap:9px;
  }

  .pic{
    height:145px;
  }

  .row{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="bar">
    <b class="logo">MR Trading</b>

    <button class="admin" onclick="toggleAdmin()">
      ⚙️ Admin
    </button>
  </div>
</header>


<section class="hero">
  <div>
    <h1>MR Trading</h1>
    <p>Quality Accessories at Best Price</p>
  </div>
</section>


<main class="wrap">


<!-- =========================
     ADMIN LOGIN
========================= -->

<section id="loginBox">

  <h2>🔐 Admin Login</h2>

  <input
    id="loginEmail"
    type="email"
    placeholder="Admin Email">

  <input
    id="loginPassword"
    type="password"
    placeholder="Password">

  <button
    class="login"
    onclick="loginAdmin()">
    Login
  </button>

  <p id="loginMsg"></p>

</section>


<!-- =========================
     ADMIN PANEL
========================= -->

<section id="panel">

  <h2>Admin Panel</h2>

  <button
    class="logout"
    onclick="logoutAdmin()">
    🚪 Logout
  </button>

  <p id="msg">
    Item যোগ/পরিবর্তন করুন
  </p>


  <div class="form">

    <input
      id="itemName"
      placeholder="Item name">


    <input
      id="itemPrice"
      type="number"
      placeholder="Price (৳)">


    <input
      id="itemCategory"
      placeholder="Category">


    <input
      id="itemPhoto"
      type="file"
      accept="image/*">


    <button
      class="save"
      type="button"
      onclick="saveItem()">

      💾 Save Item

    </button>


    <button
      type="button"
      onclick="clearForm()">

      Clear

    </button>

  </div>


  <h3>Manage Items</h3>

  <div id="manage"></div>

</section>


<!-- =========================
     ITEMS
========================= -->

<h2>Items</h2>

<div id="items" class="grid">
  Loading...
</div>


</main>


<script>

/* =========================
   SUPABASE SETTINGS
========================= */

const SUPABASE_URL =
"https://nxbjswawumjdncnokiln.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VCBsBPD9Kp_rnMNEG8g7cA_0N75E-3C";

const BUCKET =
"product-images";


/* =========================
   VARIABLES
========================= */

let items = [];

let editId = null;

let currentUser = null;


/* =========================
   ELEMENTS
========================= */

const panel =
document.getElementById("panel");

const loginBox =
document.getElementById("loginBox");

const loginMsg =
document.getElementById("loginMsg");

const msg =
document.getElementById("msg");

const nameInput =
document.getElementById("itemName");

const priceInput =
document.getElementById("itemPrice");

const categoryInput =
document.getElementById("itemCategory");

const photoInput =
document.getElementById("itemPhoto");

const itemsDiv =
document.getElementById("items");

const manageDiv =
document.getElementById("manage");


/* =========================
   HEADERS
========================= */

function headers(extra = {}){

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    ...extra

  };

}


/* =========================
   REQUEST
========================= */

async function request(
  path,
  options = {}
){

  const response =
    await fetch(

      SUPABASE_URL + path,

      {
        ...options,

        headers:
          headers(
            options.headers || {}
          )
      }

    );


  const text =
    await response.text();


  if(!response.ok){

    throw new Error(
      text ||
      ("HTTP Error " +
       response.status)
    );

  }


  if(!text){

    return null;

  }


  return JSON.parse(text);

}


/* =========================
   LOAD ITEMS
========================= */

async function loadItems(){

  itemsDiv.innerHTML =
    "Loading...";


  try{

    items =
      await request(
        "/rest/v1/products?select=*&order=created_at.desc"
      );


    if(!Array.isArray(items)){

      items = [];

    }


    drawItems();


  }catch(error){

    console.error(error);


    itemsDiv.innerHTML =
      "<p>Item load হচ্ছে না।</p>";

  }

}


/* =========================
   DRAW ITEMS
========================= */

function drawItems(){

  if(items.length === 0){

    itemsDiv.innerHTML =
      "<p>No items yet.</p>";

  }else{

    itemsDiv.innerHTML =

      items.map(function(item){

        return `

        <div class="card">

          <div class="pic">

            ${
              item.image_url

              ?

              \`
              <img
                src="\${item.image_url}"
                alt="\${esc(item.name)}">
              \`

              :

              "📦"
            }

          </div>


          <div class="info">

            <b>
              \${esc(item.name)}
            </b>


            <div class="price">

              ৳\${esc(item.price)}

            </div>


            ${
              item.category

              ?

              \`
              <small>
                \${esc(item.category)}
              </small>
              \`

              :

              ""
            }


            <br><br>


            <button
              class="order"
              onclick="whatsappOrder(
                '\${safeAttr(item.name)}',
                '\${safeAttr(item.price)}'
              )">

              WhatsApp Order

            </button>

          </div>

        </div>

        `;

      }).join("");

  }


  /* =========================
     MANAGE ITEMS
  ========================= */

  manageDiv.innerHTML =

    items.map(function(item){

      return `

      <div class="row">

        <span>

          <b>
            \${esc(item.name)}
          </b>

          <br>

          ৳\${esc(item.price)}

        </span>


        <span>

          <button
            class="edit"
            onclick="editItem(
              '\${item.id}'
            )">

            ✏️ Edit

          </button>


          <button
            class="del"
            onclick="deleteItem(
              '\${item.id}'
            )">

            Delete

          </button>

        </span>

      </div>

      `;

    }).join("");

}


/* =========================
   ADMIN LOGIN
========================= */

async function loginAdmin(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();


  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  if(!email || !password){

    loginMsg.textContent =
      "❌ Email এবং Password দিন";

    return;

  }


  loginMsg.textContent =
    "⏳ Login হচ্ছে...";


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              email:
                email,

              password:
                password

            })

        }

      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(

        data.msg ||

        data.error_description ||

        "Login failed"

      );

    }


    currentUser =
      data.user;


    localStorage.setItem(
      "mr_access_token",
      data.access_token
    );


    localStorage.setItem(
      "mr_refresh_token",
      data.refresh_token
    );


    loginMsg.textContent =
      "✅ Login successful";


    loginBox.style.display =
      "none";


    panel.style.display =
      "block";


    loadItems();


  }catch(error){

    console.error(error);


    loginMsg.textContent =
      "❌ " + error.message;

  }

}


/* =========================
   LOGOUT
========================= */

function logoutAdmin(){

  currentUser = null;


  localStorage.removeItem(
    "mr_access_token"
  );


  localStorage.removeItem(
    "mr_refresh_token"
  );


  panel.style.display =
    "none";


  loginBox.style.display =
    "none";


  clearForm();

}


/* =========================
   ADMIN BUTTON
========================= */

function toggleAdmin(){

  if(
    panel.style.display ===
    "block"
  ){

    panel.style.display =
      "none";

    return;

  }


  if(currentUser){

    panel.style.display =
      "block";

    loadItems();

  }else{

    loginBox.style.display =
      "block";

  }

}


/* =========================
   SAVE ITEM
========================= */

async function saveItem(){

  if(!currentUser){

    msg.textContent =
      "❌ আগে Admin Login করুন";

    return;

  }


  const itemName =
    nameInput.value.trim();


  const itemPrice =
    priceInput.value.trim();


  const itemCategory =
    categoryInput.value.trim();


  const file =
    photoInput.files &&
    photoInput.files.length

      ?

      photoInput.files[0]

      :

      null;


  if(!itemName){

    msg.textContent =
      "❌ Item name দিন";

    return;

  }


  if(!itemPrice){

    msg.textContent =
      "❌ Price দিন";

    return;

  }


  msg.textContent =
    "⏳ Saving...";


  try{

    let imageUrl = "";


    /* =========================
       OLD IMAGE
    ========================= */

    if(editId){

      const oldItem =
        items.find(function(item){

          return String(item.id) ===
            String(editId);

        });


      if(oldItem){

        imageUrl =
          oldItem.image_url || "";

      }

    }


    /* =========================
       IMAGE UPLOAD
    ========================= */

    if(file){

      msg.textContent =
        "⏳ Image uploading...";


      const fileName =

        Date.now() +

        "_" +

        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const uploadResponse =
        await fetch(

          SUPABASE_URL +
          "/storage/v1/object/" +
          BUCKET +
          "/" +
          fileName,

          {

            method:"POST",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                file.type ||
                "application/octet-stream",

              "x-upsert":
                "true"

            },

            body:file

          }

        );


      if(!uploadResponse.ok){

        const errorText =
          await uploadResponse.text();


        throw new Error(
          "Image upload failed: " +
          errorText
        );

      }


      imageUrl =

        SUPABASE_URL +

        "/storage/v1/object/public/" +

        BUCKET +

        "/" +

        fileName;

    }


    /* =========================
       ITEM DATA
    ========================= */

    const itemData = {

      name:
        itemName,

      price:
        Number(itemPrice),

      category:
        itemCategory,

      image_url:
        imageUrl

    };


    /* =========================
       EDIT
    ========================= */

    if(editId){

      await request(

        "/rest/v1/products?id=eq." +

        encodeURIComponent(
          editId
        ),

        {

          method:"PATCH",

          headers:{

            "Prefer":
              "return=minimal",

            "Authorization":
              "Bearer " +

              localStorage.getItem(
                "mr_access_token"
              )

          },

          body:
            JSON.stringify(
              itemData
            )

        }

      );

    }


    /* =========================
       NEW ITEM
    ========================= */

    else{

      await request(

        "/rest/v1/products",

        {

          method:"POST",

          headers:{

            "Prefer":
              "return=minimal",

            "Authorization":
              "Bearer " +

              localStorage.getItem(
                "mr_access_token"
              )

          },

          body:
            JSON.stringify(
              itemData
            )

        }

      );

    }


    msg.textContent =
      "✅ Item saved successfully!";


    clearForm();


    await loadItems();


  }catch(error){

    console.error(error);


    msg.textContent =
      "❌ Error: " +
      error.message;

  }

}


/* =========================
   EDIT ITEM
========================= */

function editItem(id){

  if(!currentUser){

    return;

  }


  const item =
    items.find(function(item){

      return String(item.id) ===
        String(id);

    });


  if(!item){

    return;

  }


  editId = id;


  nameInput.value =
    item.name || "";


  priceInput.value =
    item.price || "";


  categoryInput.value =
    item.category || "";


  photoInput.value = "";


  msg.textContent =
    "✏️ Editing: " +
    item.name;


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================
   DELETE ITEM
========================= */

async function deleteItem(id){

  if(!currentUser){

    return;

  }


  if(
    !confirm(
      "Delete করবেন?"
    )
  ){

    return;

  }


  try{

    msg.textContent =
      "⏳ Deleting...";


    await request(

      "/rest/v1/products?id=eq." +

      encodeURIComponent(id),

      {

        method:"DELETE",

        headers:{

          "Authorization":
            "Bearer " +

            localStorage.getItem(
              "mr_access_token"
            )

        }

      }

    );


    msg.textContent =
      "✅ Item deleted";


    await loadItems();


  }catch(error){

    console.error(error);


    msg.textContent =
      "❌ Delete Error: " +
      error.message;

  }

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

  editId = null;


  nameInput.value =
    "";


  priceInput.value =
    "";


  categoryInput.value =
    "";


  photoInput.value =
    "";

}


/* =========================
   WHATSAPP
========================= */

function whatsappOrder(
  name,
  price
){

  const phone =
    "8801321544741";


  const message =

    "Assalamu Alaikum,%0A%0A" +

    "আমি এই Item টি Order করতে চাই:%0A%0A" +

    "Item: " +

    encodeURIComponent(
      name
    ) +

    "%0A" +

    "Price: ৳" +

    encodeURIComponent(
      price
    ) +

    "%0A%0A" +

    "Please confirm my order.";


  window.open(

    "https://wa.me/" +

    phone +

    "?text=" +

    message,

    "_blank"

  );

}


/* =========================
   HTML ESCAPE
========================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(

    /[&<>"']/g,

    function(character){

      return {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#39;"

      }[character];

    }

  );

}


function safeAttr(value){

  return String(
    value ?? ""
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /"/g,
    "&quot;"
  );

}


/* =========================
   START
========================= */

loadItems();

</script>

</body>
</html>
