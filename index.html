<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MR Trading</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:16px;
}

.bar{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:800;
}

button{
  padding:10px 14px;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.admin{
  background:#fff;
}

.hero{
  background:#222;
  color:#fff;
  padding:45px 18px;
}

.hero>div{
  max-width:1100px;
  margin:auto;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:25px 18px;
}

#loginBox,
#panel{
  display:none;
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:25px;
}

.form{
  max-width:600px;
  display:grid;
  gap:10px;
}

input{
  padding:12px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
  box-sizing:border-box;
  width:100%;
}

.login,
.save{
  background:#111;
  color:#fff;
}

.logout{
  background:#d33;
  color:#fff;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #ddd;
}

.pic{
  height:180px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  padding:14px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.order{
  background:#111;
  color:#fff;
  width:100%;
}

.row{
  background:#eee;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.edit{
  background:#ddd;
}

.del{
  background:#d33;
  color:#fff;
}

#msg,
#loginMsg{
  font-weight:bold;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:450px){
  .grid{
    gap:9px;
  }

  .pic{
    height:145px;
  }

  .row{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="bar">

    <b class="logo">
      MR Trading
    </b>

    <button
      class="admin"
      onclick="toggleAdmin()">
      ⚙️ Admin
    </button>

  </div>
</header>


<section class="hero">

  <div>

    <h1>MR Trading</h1>

    <p>
      Quality Accessories at Best Price
    </p>

  </div>

</section>


<main class="wrap">


<!-- ADMIN LOGIN -->

<section id="loginBox">

  <h2>🔐 Admin Login</h2>

  <input
    id="loginEmail"
    type="email"
    placeholder="Admin Email">

  <br><br>

  <input
    id="loginPassword"
    type="password"
    placeholder="Password">

  <br><br>

  <button
    class="login"
    onclick="loginAdmin()">
    Login
  </button>

  <p id="loginMsg"></p>

</section>


<!-- ADMIN PANEL -->

<section id="panel">

  <h2>Admin Panel</h2>

  <button
    class="logout"
    onclick="logoutAdmin()">
    🚪 Logout
  </button>

  <p id="msg">
    Item যোগ/পরিবর্তন করুন
  </p>


  <div class="form">

    <input
      id="itemName"
      placeholder="Item name">


    <input
      id="itemPrice"
      type="number"
      placeholder="Price (৳)">


    <input
      id="itemCategory"
      placeholder="Category">


    <input
      id="itemPhoto"
      type="file"
      accept="image/*">


    <button
      class="save"
      onclick="saveItem()">
      💾 Save Item
    </button>


    <button
      onclick="clearForm()">
      Clear
    </button>

  </div>


  <h3>Manage Items</h3>

  <div id="manage"></div>

</section>


<!-- ITEMS -->

<h2>Items</h2>

<div id="items" class="grid">
  Loading...
</div>


</main>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://nxbjswawumjdncnokiln.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VCBsBPD9Kp_rnMNEG8g7cA_0N75E-3C";

const BUCKET =
"product-images";


/* =========================
   VARIABLES
========================= */

let items = [];

let editId = null;

let currentUser = null;


/* =========================
   ELEMENTS
========================= */

const loginBox =
document.getElementById("loginBox");

const panel =
document.getElementById("panel");

const loginMsg =
document.getElementById("loginMsg");

const msg =
document.getElementById("msg");

const nameInput =
document.getElementById("itemName");

const priceInput =
document.getElementById("itemPrice");

const categoryInput =
document.getElementById("itemCategory");

const photoInput =
document.getElementById("itemPhoto");

const itemsDiv =
document.getElementById("items");

const manageDiv =
document.getElementById("manage");


/* =========================
   REQUEST
========================= */

async function api(
  path,
  options={}
){

  const token =
    localStorage.getItem(
      "mr_access_token"
    );


  const response =
    await fetch(

      SUPABASE_URL + path,

      {
        ...options,

        headers:{

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            (token || SUPABASE_KEY),

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }

    );


  const text =
    await response.text();


  if(!response.ok){

    throw new Error(text);

  }


  return text
    ? JSON.parse(text)
    : null;

}


/* =========================
   LOAD ITEMS
========================= */

async function loadItems(){

  itemsDiv.innerHTML =
    "Loading...";


  try{

    items =
      await api(
        "/rest/v1/products?select=*&order=created_at.desc"
      );


    if(!Array.isArray(items)){

      items = [];

    }


    showItems();


  }catch(error){

    console.error(error);

    itemsDiv.innerHTML =
      "<p>Items load হচ্ছে না।</p>";

  }

}


/* =========================
   SHOW ITEMS
========================= */

function showItems(){

  if(items.length === 0){

    itemsDiv.innerHTML =
      "<p>No items yet.</p>";

  }else{

    itemsDiv.innerHTML =

      items.map(function(item){

        let image = "📦";


        if(item.image_url){

          image =
            '<img src="' +
            escapeHtml(
              item.image_url
            ) +
            '" alt="' +
            escapeHtml(
              item.name
            ) +
            '">';

        }


        return `

        <div class="card">

          <div class="pic">

            ${image}

          </div>

          <div class="info">

            <b>
              ${escapeHtml(
                item.name
              )}
            </b>

            <div class="price">
              ৳${escapeHtml(
                item.price
              )}
            </div>

            ${
              item.category
              ?
              `<small>
                ${escapeHtml(
                  item.category
                )}
              </small>`
              :
              ""
            }

            <br><br>

            <button
              class="order"
              onclick="orderItem(
                '${safe(item.name)}',
                '${safe(item.price)}'
              )">

              WhatsApp Order

            </button>

          </div>

        </div>

        `;

      }).join("");

  }


  manageDiv.innerHTML =

    items.map(function(item){

      return `

      <div class="row">

        <span>

          <b>
            ${escapeHtml(
              item.name
            )}
          </b>

          <br>

          ৳${escapeHtml(
            item.price
          )}

        </span>


        <span>

          <button
            class="edit"
            onclick="editItem(
              '${item.id}'
            )">

            ✏️ Edit

          </button>


          <button
            class="del"
            onclick="deleteItem(
              '${item.id}'
            )">

            Delete

          </button>

        </span>

      </div>

      `;

    }).join("");

}


/* =========================
   LOGIN
========================= */

async function loginAdmin(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();


  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  if(!email || !password){

    loginMsg.textContent =
      "❌ Email এবং Password দিন";

    return;

  }


  loginMsg.textContent =
    "⏳ Login হচ্ছে...";


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              email:
                email,

              password:
                password

            })

        }

      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(

        data.msg ||
        data.error_description ||
        "Login failed"

      );

    }


    currentUser =
      data.user;


    localStorage.setItem(
      "mr_access_token",
      data.access_token
    );


    localStorage.setItem(
      "mr_refresh_token",
      data.refresh_token
    );


    loginMsg.textContent =
      "✅ Login successful";


    loginBox.style.display =
      "none";


    panel.style.display =
      "block";


    loadItems();


  }catch(error){

    console.error(error);

    loginMsg.textContent =
      "❌ " + error.message;

  }

}


/* =========================
   LOGOUT
========================= */

function logoutAdmin(){

  currentUser = null;

  localStorage.removeItem(
    "mr_access_token"
  );

  localStorage.removeItem(
    "mr_refresh_token"
  );

  panel.style.display =
    "none";

  loginBox.style.display =
    "none";

  clearForm();

}


/* =========================
   ADMIN BUTTON
========================= */

function toggleAdmin(){

  if(
    panel.style.display ===
    "block"
  ){

    panel.style.display =
      "none";

    return;

  }


  if(currentUser){

    panel.style.display =
      "block";

    loadItems();

  }else{

    loginBox.style.display =
      "block";

  }

}


/* =========================
   SAVE ITEM
========================= */

async function saveItem(){

  if(!currentUser){

    msg.textContent =
      "❌ আগে Admin Login করুন";

    return;

  }


  const name =
    nameInput.value.trim();

  const price =
    priceInput.value.trim();

  const category =
    categoryInput.value.trim();

  const file =
    photoInput.files &&
    photoInput.files.length
      ?
      photoInput.files[0]
      :
      null;


  if(!name){

    msg.textContent =
      "❌ Item name দিন";

    return;

  }


  if(!price){

    msg.textContent =
      "❌ Price দিন";

    return;

  }


  msg.textContent =
    "⏳ Saving...";


  try{

    let imageUrl = "";


    /* OLD IMAGE */

    if(editId){

      const oldItem =
        items.find(function(item){

          return String(
            item.id
          ) === String(
            editId
          );

        });


      if(oldItem){

        imageUrl =
          oldItem.image_url ||
          "";

      }

    }


    /* IMAGE UPLOAD */

    if(file){

      msg.textContent =
        "⏳ Image uploading...";


      const fileName =
        Date.now() +
        "_" +
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const upload =
        await fetch(

          SUPABASE_URL +
          "/storage/v1/object/" +
          BUCKET +
          "/" +
          fileName,

          {

            method:"POST",

            headers:{

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                localStorage.getItem(
                  "mr_access_token"
                ),

              "Content-Type":
                file.type ||
                "application/octet-stream",

              "x-upsert":
                "true"

            },

            body:file

          }

        );


      if(!upload.ok){

        throw new Error(
          await upload.text()
        );

      }


      imageUrl =

        SUPABASE_URL +
        "/storage/v1/object/public/" +
        BUCKET +
        "/" +
        fileName;

    }


    const data = {

      name:name,

      price:Number(price),

      category:category,

      image_url:imageUrl

    };


    /* EDIT */

    if(editId){

      await api(

        "/rest/v1/products?id=eq." +
        encodeURIComponent(
          editId
        ),

        {

          method:"PATCH",

          headers:{

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              data
            )

        }

      );

    }


    /* NEW */

    else{

      await api(

        "/rest/v1/products",

        {

          method:"POST",

          headers:{

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              data
            )

        }

      );

    }


    msg.textContent =
      "✅ Item saved successfully!";


    clearForm();

    await loadItems();


  }catch(error){

    console.error(error);

    msg.textContent =
      "❌ Error: " +
      error.message;

  }

}


/* =========================
   EDIT
========================= */

function editItem(id){

  const item =
    items.find(function(item){

      return String(item.id) ===
        String(id);

    });


  if(!item){

    return;

  }


  editId = id;


  nameInput.value =
    item.name || "";

  priceInput.value =
    item.price || "";

  categoryInput.value =
    item.category || "";

  photoInput.value =
    "";


  msg.textContent =
    "✏️ Editing: " +
    item.name;


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================
   DELETE
========================= */

async function deleteItem(id){

  if(
    !confirm(
      "Delete করবেন?"
    )
  ){

    return;

  }


  try{

    msg.textContent =
      "⏳ Deleting...";


    await api(

      "/rest/v1/products?id=eq." +
      encodeURIComponent(id),

      {

        method:"DELETE"

      }

    );


    msg.textContent =
      "✅ Item deleted";


    await loadItems();


  }catch(error){

    console.error(error);

    msg.textContent =
      "❌ Delete Error: " +
      error.message;

  }

}


/* =========================
   CLEAR
========================= */

function clearForm(){

  editId = null;

  nameInput.value =
    "";

  priceInput.value =
    "";

  categoryInput.value =
    "";

  photoInput.value =
    "";

}


/* =========================
   WHATSAPP
========================= */

function orderItem(
  name,
  price
){

  const phone =
    "8801321544741";


  const message =

    "Assalamu Alaikum,%0A%0A" +

    "আমি এই Item টি Order করতে চাই:%0A%0A" +

    "Item: " +
    encodeURIComponent(
      name
    ) +

    "%0A" +

    "Price: ৳" +
    encodeURIComponent(
      price
    ) +

    "%0A%0A" +

    "Please confirm my order.";


  window.open(

    "https://wa.me/" +
    phone +
    "?text=" +
    message,

    "_blank"

  );

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  ).replace(

    /[&<>"']/g,

    function(char){

      return {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#39;"

      }[char];

    }

  );

}


function safe(value){

  return String(
    value ?? ""
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    "&quot;"
  );

}


/* =========================
   START
========================= */

loadItems();

</script>

</body>
</html>
