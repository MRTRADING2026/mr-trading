<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MR Trading</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:16px;
}

.bar,main{
  max-width:1100px;
  margin:auto;
}

.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:800;
}

button{
  padding:10px 14px;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.admin{
  background:#fff;
}

.hero{
  background:#222;
  color:#fff;
  padding:45px 18px;
}

.hero>div{
  max-width:1100px;
  margin:auto;
}

.wrap{
  padding:25px 18px;
}

#panel{
  display:none;
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:25px;
}

.form{
  max-width:600px;
  display:grid;
  gap:10px;
}

.form input{
  padding:12px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}

.save{
  background:#111;
  color:#fff;
}

.login{
  background:#111;
  color:#fff;
}

.logout{
  background:#d33;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #ddd;
}

.pic{
  height:180px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  padding:14px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.order{
  background:#111;
  color:#fff;
  width:100%;
}

.row{
  background:#eee;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.del{
  background:#d33;
  color:#fff;
}

.edit{
  background:#ddd;
}

#msg{
  font-weight:bold;
}

#loginBox{
  display:none;
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:25px;
}

#loginBox input{
  display:block;
  width:100%;
  max-width:500px;
  box-sizing:border-box;
  padding:12px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}

#loginMsg{
  font-weight:bold;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:450px){
  .grid{
    gap:9px;
  }

  .pic{
    height:145px;
  }

  .row{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="bar">
    <b class="logo">MR Trading</b>

    <button class="admin" onclick="toggleAdmin()">
      ⚙️ Admin
    </button>
  </div>
</header>

<section class="hero">
  <div>
    <h1>MR Trading</h1>
    <p>Quality Accessories at Best Price</p>
  </div>
</section>

<main class="wrap">

<section id="loginBox">

  <h2>🔐 Admin Login</h2>

  <input
    id="loginEmail"
    type="email"
    placeholder="Admin Email">

  <input
    id="loginPassword"
    type="password"
    placeholder="Password">

  <button
    class="login"
    onclick="loginAdmin()">
    Login
  </button>

  <p id="loginMsg"></p>

</section>


<section id="panel">

<h2>Admin Panel</h2>

<button
  class="logout"
  onclick="logoutAdmin()">
  Logout
</button>

<p id="msg">Item যোগ/পরিবর্তন করুন</p>

<div class="form">

<input
  id="productName"
  placeholder="Item name">

<input
  id="productPrice"
  type="number"
  placeholder="Price (৳)">

<input
  id="productCategory"
  placeholder="Category">

<input
  id="productPhoto"
  type="file"
  accept="image/*">

<button
  class="save"
  type="button"
  onclick="saveProduct()">
💾 Save Item
</button>

<button
  type="button"
  onclick="clearForm()">
Clear
</button>

</div>

<h3>Manage Items</h3>

<div id="manage"></div>

</section>


<h2>Items</h2>

<div id="products" class="grid">
Loading...
</div>

</main>


<script>

const SUPABASE_URL =
"https://nxbjswawumjdncnokiln.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VCBsBPD9Kp_rnMNEG8g7cA_0N75E-3C";

const BUCKET =
"product-images";

let items = [];
let editId = null;
let currentUser = null;

const panel =
document.getElementById("panel");

const loginBox =
document.getElementById("loginBox");

const msg =
document.getElementById("msg");

const loginMsg =
document.getElementById("loginMsg");

const nameInput =
document.getElementById("productName");

const priceInput =
document.getElementById("productPrice");

const categoryInput =
document.getElementById("productCategory");

const photoInput =
document.getElementById("productPhoto");

const productsDiv =
document.getElementById("products");

const manageDiv =
document.getElementById("manage");


function headers(extra = {}){

  return {
    "apikey": SUPABASE_KEY,
    "Authorization":
      "Bearer " + SUPABASE_KEY,
    "Content-Type":
      "application/json",
    ...extra
  };

}


async function request(path, options = {}){

  const response =
    await fetch(
      SUPABASE_URL + path,
      {
        ...options,
        headers:
          headers(options.headers || {})
      }
    );

  const text =
    await response.text();

  if(!response.ok){

    throw new Error(
      text ||
      ("HTTP Error " + response.status)
    );

  }

  if(!text){
    return null;
  }

  return JSON.parse(text);

}


async function loadProducts(){

  productsDiv.innerHTML =
    "Loading...";

  try{

    items =
      await request(
        "/rest/v1/product?select=*&order=created_at.desc"
      );

    if(!Array.isArray(items)){
      items = [];
    }

    drawProducts();

  }catch(error){

    console.error(error);

    productsDiv.innerHTML =
      "<p>Item load হচ্ছে না।</p>";

  }

}


function drawProducts(){

  if(items.length === 0){

    productsDiv.innerHTML =
      "<p>No items yet.</p>";

  }else{

    productsDiv.innerHTML =
      items.map(function(item){

        return `

        <div class="card">

          <div class="pic">

            ${
              item.image_url
              ?
              `<img
                src="${item.image_url}"
                alt="${esc(item.name)}">`
              :
              "📦"
            }

          </div>

          <div class="info">

            <b>
              ${esc(item.name)}
            </b>

            <div class="price">
              ৳${esc(item.price)}
            </div>

            ${
              item.category
              ?
              `<small>
                ${esc(item.category)}
              </small>`
              :
              ""
            }

            <br><br>

            <button
              class="order"
              onclick="whatsappOrder(
                '${safeAttr(item.name)}',
                '${safeAttr(item.price)}'
              )">
              WhatsApp Order
            </button>

          </div>

        </div>

        `;

      }).join("");

  }


  manageDiv.innerHTML =
    items.map(function(item){

      return `

      <div class="row">

        <span>

          <b>
            ${esc(item.name)}
          </b>

          <br>

          ৳${esc(item.price)}

        </span>

        <span>

          <button
            class="edit"
            onclick="editProduct('${item.id}')">
            ✏️ Edit
          </button>

          <button
            class="del"
            onclick="deleteProduct('${item.id}')">
            Delete
          </button>

        </span>

      </div>

      `;

    }).join("");

}


async function loginAdmin(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  if(!email || !password){

    loginMsg.textContent =
      "❌ Email এবং Password দিন";

    return;

  }


  loginMsg.textContent =
    "⏳ Login হচ্ছে...";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email:email,
            password:password
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.msg ||
        data.error_description ||
        "Login failed"
      );

    }


    currentUser =
      data.user;


    localStorage.setItem(
      "mr_access_token",
      data.access_token
    );

    localStorage.setItem(
      "mr_refresh_token",
      data.refresh_token
    );


    loginMsg.textContent =
      "✅ Login successful";


    loginBox.style.display =
      "none";

    panel.style.display =
      "block";


    loadProducts();


  }catch(error){

    console.error(error);

    loginMsg.textContent =
      "❌ " + error.message;

  }

}


function logoutAdmin(){

  currentUser = null;

  localStorage.removeItem(
    "mr_access_token"
  );

  localStorage.removeItem(
    "mr_refresh_token"
  );

  panel.style.display =
    "none";

  clearForm();

}


function toggleAdmin(){

  if(panel.style.display === "block"){

    panel.style.display =
      "none";

    return;

  }


  if(currentUser){

    panel.style.display =
      "block";

    loadProducts();

  }else{

    loginBox.style.display =
      "block";

    panel.style.display =
      "none";

  }

}


async function saveProduct(){

  if(!currentUser){

    msg.textContent =
      "❌ আগে Admin Login করুন";

    return;

  }


  const productName =
    nameInput.value.trim();

  const productPrice =
    priceInput.value.trim();

  const productCategory =
    categoryInput.value.trim();

  const file =
    photoInput.files &&
    photoInput.files.length
      ?
      photoInput.files[0]
      :
      null;


  if(!productName){

    msg.textContent =
      "❌ Item name দিন";

    return;

  }


  if(!productPrice){

    msg.textContent =
      "❌ Price দিন";

    return;

  }


  msg.textContent =
    "⏳ Saving...";


  try{

    let imageUrl = "";


    if(editId){

      const oldItem =
        items.find(function(item){

          return String(item.id) ===
                 String(editId);

        });


      if(oldItem){

        imageUrl =
          oldItem.image_url || "";

      }

    }


    if(file){

      msg.textContent =
        "⏳ Image uploading...";


      const fileName =
        Date.now() +
        "_" +
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const uploadResponse =
        await fetch(

          SUPABASE_URL +
          "/storage/v1/object/" +
          BUCKET +
          "/" +
          fileName,

          {
            method:"POST",

            headers:{
              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                file.type ||
                "application/octet-stream",

              "x-upsert":
                "true"
            },

            body:file

          }

        );


      if(!uploadResponse.ok){

        const errorText =
          await uploadResponse.text();

        throw new Error(
          "Image upload failed: " +
          errorText
        );

      }


      imageUrl =
        SUPABASE_URL +
        "/storage/v1/object/public/" +
        BUCKET +
        "/" +
        fileName;

    }


    const itemData = {

      name:productName,

      price:Number(productPrice),

      category:productCategory,

      image_url:imageUrl

    };


    if(editId){

      await request(
        "/rest/v1/product?id=eq." +
        encodeURIComponent(editId),

        {
          method:"PATCH",

          headers:{
            "Prefer":
              "return=minimal",

            "Authorization":
              "Bearer " +
              localStorage.getItem(
                "mr_access_token"
              )
          },

          body:
            JSON.stringify(
              itemData
            )
        }
      );

    }else{

      await request(
        "/rest/v1/product",

        {
          method:"POST",

          headers:{
            "Prefer":
              "return=minimal",

            "Authorization":
              "Bearer " +
              localStorage.getItem(
                "mr_access_token"
              )
          },

          body:
            JSON.stringify(
              itemData
            )
        }
      );

    }


    msg.textContent =
      "✅ Item saved successfully!";

    clearForm();

    await loadProducts();


  }catch(error){

    console.error(error);

    msg.textContent =
      "❌ Error: " +
      error.message;

  }

}


function editProduct(id){

  if(!currentUser){
    return;
  }


  const item =
    items.find(function(item){

      return String(item.id) ===
             String(id);

    });


  if(!item){
    return;
  }


  editId = id;

  nameInput.value =
    item.name || "";

  priceInput.value =
    item.price || "";

  categoryInput.value =
    item.category || "";

  photoInput.value = "";


  msg.textContent =
    "✏️ Editing: " +
    item.name;


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


async function deleteProduct(id){

  if(!currentUser){
    return;
  }


  if(!confirm(
    "Delete করবেন?"
  )){
    return;
  }


  try{

    msg.textContent =
      "⏳ Deleting...";


    await request(
      "/rest/v1/product?id=eq." +
      encodeURIComponent(id),

      {
        method:"DELETE",

        headers:{
          "Authorization":
            "Bearer " +
            localStorage.getItem(
              "mr_access_token"
            )
        }
      }
    );


    msg.textContent =
      "✅ Item deleted";

    await loadProducts();


  }catch(error){

    console.error(error);

    msg.textContent =
      "❌ Delete Error: " +
      error.message;

  }

}


function clearForm(){

  editId = null;

  nameInput.value = "";

  priceInput.value = "";

  categoryInput.value = "";

  photoInput.value = "";

}


function whatsappOrder(name, price){

  const phone =
    "8801321544741";

  const message =
    "Assalamu Alaikum,%0A%0A" +
    "আমি এই Item টি Order করতে চাই:%0A%0A" +
    "Item: " +
    encodeURIComponent(name) +
    "%0A" +
    "Price: ৳" +
    encodeURIComponent(price) +
    "%0A%0A" +
    "Please confirm my order.";


  window.open(
    "https://wa.me/" +
    phone +
    "?text=" +
    message,
    "_blank"
  );

}


function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(character){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"

        }[character];

      }
    );

}


function safeAttr(value){

  return String(value ?? "")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}


loadProducts();

</script>

</body>
</html>
