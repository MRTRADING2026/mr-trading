<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR Trading</title><style>body{font-family:Arial;margin:0;background:#f5f5f5;color:#111}header{background:#111;color:#fff;padding:16px}.bar,main{max-width:1100px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:800}button{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.admin{background:#fff}.hero{background:#222;color:#fff;padding:45px 18px}.hero>div{max-width:1100px;margin:auto}.wrap{padding:25px 18px}#panel{display:none;background:#fff;padding:20px;border-radius:12px;margin-bottom:25px}.form{max-width:600px;display:grid;gap:10px}.form input{padding:12px;border:1px solid #ccc;border-radius:7px}.save{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #ddd}.pic{height:180px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:55px}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.price{font-size:20px;font-weight:bold;margin:8px 0}.order{background:#111;color:#fff;width:100%}.row{background:#eee;padding:12px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between}.del{background:#d33;color:#fff}.edit{background:#ddd}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{gap:9px}.pic{height:145px}.row{flex-direction:column}}</style></head><body>
<header><div class="bar"><b class="logo">MR Trading</b><button class="admin" onclick="toggle()">⚙️ Admin</button></div></header>
<section class="hero"><div><h1>MR Trading</h1><p>Quality Accessories at Best Price</p></div></section>
<main class="wrap"><section id="panel"><h2>Admin Panel</h2><p id="msg">Product যোগ/পরিবর্তন করুন</p><div class="form"><input id="name" placeholder="Product name"><input id="price" type="number" placeholder="Price (৳)"><input id="category" placeholder="Category"><input id="photo" type="file" accept="image/*"><button class="save" onclick="saveProduct()">💾 Save Product</button><button onclick="clearForm()">Clear</button></div><h3>Manage Products</h3><div id="manage"></div></section><h2>Products</h2><div id="products" class="grid">Loading...</div></main>
<script>
const URL="https://nxbjswawumjdncnokiln.supabase.co",KEY="sb_publishable_VCBsBPD9Kp_rnMNEG8g7cA_0N75E-3C",BUCKET="product-images";let items=[],editId=null;
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
async function req(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{...H,...(opt.headers||{})}});let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}
async function load(){try{items=await req("/rest/v1/products?select=*&order=created_at.desc")||[];draw()}catch(e){document.getElementById("products").innerHTML="<p>Load error. Supabase policy check করুন.</p>";console.log(e)}}
function draw(){document.getElementById("products").innerHTML=items.length?items.map((x,i)=>`<div class="card"><div class="pic">${x.image_url?`<img src="${x.image_url}">`:"📦"}</div><div class="info"><b>${esc(x.name)}</b><div class="price">৳${esc(x.price)}</div><button class="order" onclick="wa('${esc(x.name)}','${esc(x.price)}')">WhatsApp Order</button></div></div>`).join(""):"<p>No products yet.</p>";document.getElementById("manage").innerHTML=items.map(x=>`<div class="row"><span><b>${esc(x.name)}</b><br>৳${esc(x.price)}</span><span><button class="edit" onclick="edit('${x.id}')">✏️ Edit</button> <button class="del" onclick="del('${x.id}')">Delete</button></span></div>`).join("")}
async function saveProduct(){let n=name.value.trim(),pr=price.value.trim(),cat=category.value.trim(),f=photo.files[0];if(!n||!pr){msg.textContent="Name ও price দিন";return}try{let image="";if(editId){let old=items.find(x=>String(x.id)==String(editId));image=old?.image_url||""}if(f){let file=Date.now()+"_"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");let r=await fetch(URL+"/storage/v1/object/"+BUCKET+"/"+file,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":f.type||"application/octet-stream","x-upsert":"true"},body:f});if(!r.ok)throw Error(await r.text());image=URL+"/storage/v1/object/public/"+BUCKET+"/"+file}let body={name:n,price:Number(pr),category:cat,image_url:image};if(editId)await req("/rest/v1/products?id=eq."+editId,{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify(body)});else await req("/rest/v1/products",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify(body)});msg.textContent="Saved successfully";clearForm();load()}catch(e){msg.textContent="Error: "+e.message}}
function edit(id){let x=items.find(a=>String(a.id)==String(id));editId=id;name.value=x.name;price.value=x.price;category.value=x.category||"";photo.value="";msg.textContent="Editing: "+x.name;scrollTo({top:0,behavior:"smooth"})}
async function del(id){if(!confirm("Delete করবেন?"))return;try{await req("/rest/v1/products?id=eq."+id,{method:"DELETE"});load()}catch(e){alert(e.message)}}
function clearForm(){editId=null;name.value="";price.value="";category.value="";photo.value=""}
function toggle(){panel.style.display=panel.style.display=="block"?"none":"block";load()}
function wa(n,p){alert("WhatsApp number এখনো সেট করা হয়নি।\nOrder: "+n+" | ৳"+p)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]) )}
load();
</script></body></html>
